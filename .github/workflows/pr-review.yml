name: Automated PR review (comment-only) — Anthropic cloud backend, INACTIVE

# ⚠️ INACTIVE BY DEFAULT — cost-gated, not broken.
#
# This is one of two backends for the same hybrid-rubric review (the prompt is
# built by scripts/pr-review/build-prompt.sh, shared with the other backend).
# It calls the Anthropic API, which costs real money per PR review — with a
# cohort landing ~10 PRs/day, that adds up fast for no clear benefit over the
# free alternative below. So the default path right now is:
#
#   scripts/pr-review/review-local.sh <PR_NUMBER> --post
#
# — same rubric, same prompt, run against your own local Ollama instance
# (qwen2.5-coder:32b or any other locally-pulled code-capable model) at zero
# marginal cost per review. See docs/public/guides/reviewing-cohort-prs.md for
# the full comparison and when you might actually want this workflow instead
# (e.g. once GitHub-hosted runners can reach a real inference endpoint you're
# willing to pay for, or a self-hosted runner is reachable from this repo's
# Actions and can reach your own Ollama).
#
# To reactivate:
#   1. Uncomment the `pull_request:` trigger below.
#   2. `gh secret set ANTHROPIC_API_KEY`.
# Both steps deliberately require a conscious decision — this file is kept
# working and reviewed as documentation of that alternative, not deleted.

on:
  # pull_request:
  #   types: [opened, synchronize, reopened]
  workflow_dispatch: {} # manual-only trigger while the automatic one stays commented out

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    # Never let this job block merge — branch protection's required check is `typecheck-and-build`
    # and 1 human approval (see .github/workflows/ci.yml and repo branch protection settings).
    # This job only posts a comment. It must never approve, request changes, or merge.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build review prompt (shared with the local Ollama backend)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git diff "origin/${BASE_REF}...HEAD" -- services/frontend services/backend > /tmp/pr.diff
          scripts/pr-review/build-prompt.sh "$BRANCH" /tmp/pr.diff > /tmp/review-prompt.md
          sed -n 's/^PROMPT_BUILDER_VERSION="\([^"]*\)".*/\1/p' scripts/pr-review/build-prompt.sh | head -1 > /tmp/prompt-builder-version.txt

      - name: Run review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY secret not set — skipping automated review." >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PYEOF'
          import json, os, urllib.request

          with open("/tmp/review-prompt.md") as f:
              prompt = f.read()
          try:
              with open("/tmp/prompt-builder-version.txt") as f:
                  builder_version = f.read().strip() or "unknown"
          except FileNotFoundError:
              builder_version = "unknown"

          body = json.dumps({
              "model": "claude-sonnet-5",
              "max_tokens": 2000,
              "messages": [{"role": "user", "content": prompt}],
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=body,
              headers={
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json",
              },
          )
          with urllib.request.urlopen(req) as resp:
              result = json.load(resp)

          text = "".join(block.get("text", "") for block in result.get("content", []))
          with open("/tmp/review-body.md", "w") as f:
              f.write(
                  "### 🤖 Automated review (hybrid rubric — cloud claude-sonnet-5, "
                  f"prompt-builder {builder_version}, comment only)\n\n"
              )
              f.write(text)
              f.write(
                  "\n\n---\n"
                  f"*Posted automatically with `scripts/pr-review/build-prompt.sh` "
                  f"**v{builder_version}**. Does not approve or block merge — a human "
                  f"review is still required.*\n"
              )
          PYEOF

      - name: Post comment
        if: steps.review.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file /tmp/review-body.md
